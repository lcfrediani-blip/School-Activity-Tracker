openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
  - name: student
  - name: teacher
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/profile:
    post:
      operationId: createAccountProfile
      tags: [account]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileInput"
      responses:
        "200":
          description: Existing profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "201":
          description: Profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
    get:
      operationId: getAccountProfile
      tags: [account]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
  /student/sync:
    put:
      operationId: syncStudentData
      tags: [student]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentSyncInput" }
      responses:
        "200":
          description: Merged activities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentSyncResponse" }
  /teacher/classes:
    get:
      operationId: listTeacherClasses
      tags: [teacher]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Institution classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Class" }
    post:
      operationId: createTeacherClass
      tags: [teacher]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInput" }
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
  /teacher/students:
    get:
      operationId: searchTeacherStudents
      tags: [teacher]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string, default: "" }
      responses:
        "200":
          description: Students in the teacher's institution
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentSummary" }
  /teacher/students/{studentId}:
    get:
      operationId: getTeacherStudent
      tags: [teacher]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: studentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Student and activities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDetail" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccountProfileInput:
      type: object
      required: [role, name]
      properties:
        role: { type: string, enum: [student, teacher] }
        name: { type: string, minLength: 1 }
        classCode: { type: string }
        teacherCode: { type: string }
        institutionName: { type: string }
    AccountProfile:
      type: object
      required: [id, clerkUserId, role, name, email, institutionId, institutionName]
      properties:
        id: { type: string }
        clerkUserId: { type: string }
        role: { type: string, enum: [student, teacher] }
        name: { type: string }
        email: { type: string }
        institutionId: { type: string }
        institutionName: { type: string }
        classId: { type: [string, "null"] }
        className: { type: [string, "null"] }
        teacherCode: { type: [string, "null"] }
    Activity:
      type: object
      required: [id, title, date, location, hours, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, minLength: 1 }
        date: { type: string }
        location: { type: string }
        hours: { type: number, minimum: 0 }
        updatedAt: { type: string, format: date-time }
    StudentSyncInput:
      type: object
      required: [activities, deletedIds]
      properties:
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        deletedIds:
          type: array
          items: { type: string }
    StudentSyncResponse:
      type: object
      required: [activities, deletedIds]
      properties:
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        deletedIds:
          type: array
          items: { type: string }
    ClassInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    Class:
      type: object
      required: [id, name, joinCode, institutionId]
      properties:
        id: { type: string }
        name: { type: string }
        joinCode: { type: string }
        institutionId: { type: string }
    StudentSummary:
      type: object
      required: [id, name, email, className, activitiesCount, totalHours]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        className: { type: [string, "null"] }
        activitiesCount: { type: integer }
        totalHours: { type: number }
    StudentDetail:
      allOf:
        - $ref: "#/components/schemas/StudentSummary"
        - type: object
          required: [activities]
          properties:
            activities:
              type: array
              items: { $ref: "#/components/schemas/Activity" }

